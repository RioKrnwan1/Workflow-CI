name: MLflow CI and Docker Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: file:${{ github.workspace }}/MLProject/mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check environment
        run: |
          python --version
          pip --version
          docker --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.9.1 pandas pillow

      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          echo "MLflow tracking URI: $MLFLOW_TRACKING_URI"
          mlflow run . --env-manager=local

      - name: Inspect MLflow storage
        run: |
          find MLProject/mlruns -maxdepth 4 -type f 2>/dev/null | head -100

          python - <<'PY'
          import os
          from mlflow.tracking import MlflowClient

          uri = os.environ["MLFLOW_TRACKING_URI"]
          client = MlflowClient(tracking_uri=uri)

          for experiment in client.search_experiments():
              print("Experiment:", experiment.name)
              print("Experiment ID:", experiment.experiment_id)

              runs = client.search_runs(
                  experiment_ids=[experiment.experiment_id],
                  order_by=["attributes.start_time DESC"],
                  max_results=5
              )

              for run in runs:
                  print("Run ID:", run.info.run_id)
                  print("Status:", run.info.status)
                  print("Artifact URI:", run.info.artifact_uri)
          PY

      - name: Get latest MLflow run ID
        id: latest-run
        run: |
          python - <<'PY'
          import os
          from mlflow.tracking import MlflowClient

          uri = os.environ["MLFLOW_TRACKING_URI"]
          client = MlflowClient(tracking_uri=uri)

          runs = client.search_runs(
              experiment_ids=["0"],
              order_by=["attributes.start_time DESC"],
              max_results=1
          )

          if not runs:
              raise RuntimeError(
                  "Run MLflow tidak ditemukan pada eksperimen Default."
              )

          run_id = runs[0].info.run_id
          print(f"Latest MLflow run ID: {run_id}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run_id={run_id}\n")
          PY

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns/
          if-no-files-found: error
          retention-days: 7

      - name: Build Docker model
        run: |
          mlflow models build-docker \
            --env-manager local \
            --model-uri "runs:/${{ steps.latest-run.outputs.run_id }}/model" \
            --name "plant-disease-model:latest"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag plant-disease-model:latest \
            riokrnwan1/plant-disease-model:latest

      - name: Push Docker image
        run: |
          docker push riokrnwan1/plant-disease-model:latest

      - name: Post login
        if: always()
        run: docker logout || true